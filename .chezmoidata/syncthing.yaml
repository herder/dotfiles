# Syncthing cluster over the tailnet, keyed by tailnet hostname. A new machine
# prints its device ID on first `chezmoi apply`; add it here and apply on every
# peer. Example entry:  sobchak: XXXXXXX-XXXXXXX-...-XXXXXXX
syncthing:
  devices:
    biglebowski: N5JZ6GM-NI2YXVT-3UEKJ6C-TU37T4I-XSBGLGN-H3ZOHMP-7LBYAHI-GQVVRQU
    sobchak: DJKJCBJ-UUOIAG3-NKZS7LG-7GN5CTT-WKTLAQC-5RJLIJI-ZM7HRWS-N6S4EAR
    lebowski: LGA77EP-WC3UJRX-56PLIAA-E2LWZDV-OOEHOJI-SHYXZY5-LEV7IFK-OMS4ZAB
  # path is relative to $HOME and mounted into the container at the same
  # absolute path. devices (hostnames) is optional and defaults to all of them.
  folders:
    wallpapers:
      label: Wallpapers
      path: Pictures/Wallpapers
      # devices: [biglebowski, sobchak]
