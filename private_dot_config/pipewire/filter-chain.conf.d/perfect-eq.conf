# Perfect EQ - parametric equalizer via PipeWire filter-chain
# Ported from EasyEffects "Perfect EQ" preset (JackHack96/EasyEffects-Presets)
#
# 10-band peaking EQ, identical L/R. Bands at 250 Hz and 2 kHz omitted (0 dB gain).
# Original preset had -2 dB input gain for headroom; omitted here as PipeWire
# processes in 32-bit float internally.
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Perfect EQ"
            media.name       = "Perfect EQ"
            filter.graph = {
                nodes = [
                    # Left channel
                    { type = builtin label = bq_peaking name = eqL_32  config = { Freq = 32    Q = 1.5048 Gain = 4.0  } }
                    { type = builtin label = bq_peaking name = eqL_64  config = { Freq = 64    Q = 1.5048 Gain = 2.0  } }
                    { type = builtin label = bq_peaking name = eqL_125 config = { Freq = 125   Q = 1.5048 Gain = 1.0  } }
                    { type = builtin label = bq_peaking name = eqL_500 config = { Freq = 500   Q = 1.5048 Gain = -1.0 } }
                    { type = builtin label = bq_peaking name = eqL_1k  config = { Freq = 1000  Q = 1.5048 Gain = -2.0 } }
                    { type = builtin label = bq_peaking name = eqL_4k  config = { Freq = 4000  Q = 1.5048 Gain = 2.0  } }
                    { type = builtin label = bq_peaking name = eqL_8k  config = { Freq = 8000  Q = 1.5048 Gain = 3.0  } }
                    { type = builtin label = bq_peaking name = eqL_16k config = { Freq = 16000 Q = 1.5048 Gain = 3.0  } }

                    # Right channel
                    { type = builtin label = bq_peaking name = eqR_32  config = { Freq = 32    Q = 1.5048 Gain = 4.0  } }
                    { type = builtin label = bq_peaking name = eqR_64  config = { Freq = 64    Q = 1.5048 Gain = 2.0  } }
                    { type = builtin label = bq_peaking name = eqR_125 config = { Freq = 125   Q = 1.5048 Gain = 1.0  } }
                    { type = builtin label = bq_peaking name = eqR_500 config = { Freq = 500   Q = 1.5048 Gain = -1.0 } }
                    { type = builtin label = bq_peaking name = eqR_1k  config = { Freq = 1000  Q = 1.5048 Gain = -2.0 } }
                    { type = builtin label = bq_peaking name = eqR_4k  config = { Freq = 4000  Q = 1.5048 Gain = 2.0  } }
                    { type = builtin label = bq_peaking name = eqR_8k  config = { Freq = 8000  Q = 1.5048 Gain = 3.0  } }
                    { type = builtin label = bq_peaking name = eqR_16k config = { Freq = 16000 Q = 1.5048 Gain = 3.0  } }
                ]
                links = [
                    # Left channel chain
                    { output = "eqL_32:Out"  input = "eqL_64:In"  }
                    { output = "eqL_64:Out"  input = "eqL_125:In" }
                    { output = "eqL_125:Out" input = "eqL_500:In" }
                    { output = "eqL_500:Out" input = "eqL_1k:In"  }
                    { output = "eqL_1k:Out"  input = "eqL_4k:In"  }
                    { output = "eqL_4k:Out"  input = "eqL_8k:In"  }
                    { output = "eqL_8k:Out"  input = "eqL_16k:In" }

                    # Right channel chain
                    { output = "eqR_32:Out"  input = "eqR_64:In"  }
                    { output = "eqR_64:Out"  input = "eqR_125:In" }
                    { output = "eqR_125:Out" input = "eqR_500:In" }
                    { output = "eqR_500:Out" input = "eqR_1k:In"  }
                    { output = "eqR_1k:Out"  input = "eqR_4k:In"  }
                    { output = "eqR_4k:Out"  input = "eqR_8k:In"  }
                    { output = "eqR_8k:Out"  input = "eqR_16k:In" }
                ]
                inputs  = [ "eqL_32:In" "eqR_32:In" ]
                outputs = [ "eqL_16k:Out" "eqR_16k:Out" ]
            }
            capture.props = {
                node.name      = "effect_input.perfect-eq"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = "effect_output.perfect-eq"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
