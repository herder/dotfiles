# Advanced Auto Gain for built-in laptop speakers
# Ported from EasyEffects "Advanced Auto Gain" preset (JackHack96/EasyEffects-Presets)
#
# Processing chain: 30-band parametric EQ → upward compressor (auto-gain) → limiter
# Only bands with non-zero gain are included (11 of 30). All bands: Q=4.36, Bell type.
# Original preset used EBU R128 loudness normalization at -12 LUFS; approximated here
# with an upward compressor targeting the same level.
#
# Exciter stage omitted — minimal benefit on laptop speakers and no native equivalent.
# EQ input gain (-0.3 dB) omitted — negligible in 32-bit float.
# EQ output gain (-6.5 dB) folded into compressor input gain.
#
# This filter targets the built-in speaker sink only. WirePlumber's smart filter
# routing gives targeted filters precedence over targetless ones (Perfect EQ),
# so there is no double-stacking.
#
# NOTE: node.name in filter.smart.target is hardware-specific (PCI address).
# Adjust if running on different hardware.
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker Auto Gain"
            media.name       = "Speaker Auto Gain"
            filter.graph = {
                nodes = [
                    # ---- EQ Left channel (11 active bands) ----
                    { type = builtin label = bq_peaking name = eqL_113  config = { Freq = 113.21  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_143  config = { Freq = 142.53  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_179  config = { Freq = 179.43  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_226  config = { Freq = 225.89  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_284  config = { Freq = 284.38  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_358  config = { Freq = 358.02  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqL_714  config = { Freq = 714.34  Q = 4.36 Gain = -1.0  } }
                    { type = builtin label = bq_peaking name = eqL_899  config = { Freq = 899.29  Q = 4.36 Gain = -2.0  } }
                    { type = builtin label = bq_peaking name = eqL_1k1  config = { Freq = 1132.15 Q = 4.36 Gain = -3.6  } }
                    { type = builtin label = bq_peaking name = eqL_1k4  config = { Freq = 1425.29 Q = 4.36 Gain = -2.5  } }
                    { type = builtin label = bq_peaking name = eqL_1k8  config = { Freq = 1794.33 Q = 4.36 Gain = -1.5  } }

                    # ---- EQ Right channel (identical parameters) ----
                    { type = builtin label = bq_peaking name = eqR_113  config = { Freq = 113.21  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_143  config = { Freq = 142.53  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_179  config = { Freq = 179.43  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_226  config = { Freq = 225.89  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_284  config = { Freq = 284.38  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_358  config = { Freq = 358.02  Q = 4.36 Gain = 4.0   } }
                    { type = builtin label = bq_peaking name = eqR_714  config = { Freq = 714.34  Q = 4.36 Gain = -1.0  } }
                    { type = builtin label = bq_peaking name = eqR_899  config = { Freq = 899.29  Q = 4.36 Gain = -2.0  } }
                    { type = builtin label = bq_peaking name = eqR_1k1  config = { Freq = 1132.15 Q = 4.36 Gain = -3.6  } }
                    { type = builtin label = bq_peaking name = eqR_1k4  config = { Freq = 1425.29 Q = 4.36 Gain = -2.5  } }
                    { type = builtin label = bq_peaking name = eqR_1k8  config = { Freq = 1794.33 Q = 4.36 Gain = -1.5  } }

                    # ---- Upward compressor (auto-gain approximation) ----
                    # LSP Compressor Stereo — upward mode brings quiet signals toward
                    # the attack threshold, approximating EBU R128 normalization at -12 LUFS.
                    {
                        type   = ladspa
                        name   = comp
                        plugin = lsp-plugins-ladspa
                        label  = "http://lsp-plug.in/plugins/ladspa/compressor_stereo"
                        control = {
                            "Input gain (G)"          = 0.473   # -6.5 dB (original EQ output gain)
                            "Output gain (G)"         = 1.0
                            "Compression mode"        = 1       # Upward
                            "Sidechain mode"          = 1       # RMS
                            "Sidechain reactivity (ms)" = 80
                            "Attack threshold (G)"    = 0.251   # -12 dB (autogain target)
                            "Attack time (ms)"        = 100
                            "Release threshold (G)"   = 0.0
                            "Release time (ms)"       = 500
                            "Ratio"                   = 4.0
                            "Knee (G)"                = 0.5     # -6 dB soft knee
                            "Makeup gain (G)"         = 1.0
                            "Dry gain (G)"            = 0.0
                            "Wet gain (G)"            = 1.0
                        }
                    }

                    # ---- Limiter (prevents clipping from auto-gain boost) ----
                    # LSP Limiter Stereo — settings match the original EasyEffects preset.
                    {
                        type   = ladspa
                        name   = lim
                        plugin = lsp-plugins-ladspa
                        label  = "http://lsp-plug.in/plugins/ladspa/limiter_stereo"
                        control = {
                            "Operating mode"          = 0       # Herm Thin
                            "Threshold (G)"           = 1.0     # 0 dB
                            "Lookahead (ms)"          = 10.0
                            "Attack time (ms)"        = 5.0
                            "Release time (ms)"       = 5.0
                            "Gain boost"              = 1.0     # on
                            "Automatic level regulation" = 0.0  # off
                            "Oversampling"            = 5       # Half x4/16 bit
                            "Stereo linking (%)"      = 100.0
                        }
                    }
                ]
                links = [
                    # Left EQ chain
                    { output = "eqL_113:Out" input = "eqL_143:In" }
                    { output = "eqL_143:Out" input = "eqL_179:In" }
                    { output = "eqL_179:Out" input = "eqL_226:In" }
                    { output = "eqL_226:Out" input = "eqL_284:In" }
                    { output = "eqL_284:Out" input = "eqL_358:In" }
                    { output = "eqL_358:Out" input = "eqL_714:In" }
                    { output = "eqL_714:Out" input = "eqL_899:In" }
                    { output = "eqL_899:Out" input = "eqL_1k1:In" }
                    { output = "eqL_1k1:Out" input = "eqL_1k4:In" }
                    { output = "eqL_1k4:Out" input = "eqL_1k8:In" }

                    # Right EQ chain
                    { output = "eqR_113:Out" input = "eqR_143:In" }
                    { output = "eqR_143:Out" input = "eqR_179:In" }
                    { output = "eqR_179:Out" input = "eqR_226:In" }
                    { output = "eqR_226:Out" input = "eqR_284:In" }
                    { output = "eqR_284:Out" input = "eqR_358:In" }
                    { output = "eqR_358:Out" input = "eqR_714:In" }
                    { output = "eqR_714:Out" input = "eqR_899:In" }
                    { output = "eqR_899:Out" input = "eqR_1k1:In" }
                    { output = "eqR_1k1:Out" input = "eqR_1k4:In" }
                    { output = "eqR_1k4:Out" input = "eqR_1k8:In" }

                    # EQ → Compressor
                    { output = "eqL_1k8:Out" input = "comp:Input L" }
                    { output = "eqR_1k8:Out" input = "comp:Input R" }

                    # Compressor → Limiter
                    { output = "comp:Output L" input = "lim:Input L" }
                    { output = "comp:Output R" input = "lim:Input R" }
                ]
                inputs  = [ "eqL_113:In" "eqR_113:In" ]
                outputs = [ "lim:Output L" "lim:Output R" ]
            }
            capture.props = {
                node.name            = "effect_input.speaker-autogain"
                media.class          = Audio/Sink
                audio.channels       = 2
                audio.position       = [ FL FR ]
                filter.smart         = true
                filter.smart.name    = "speaker-autogain"
                filter.smart.target  = { "node.name" = "alsa_output.pci-0000_e7_00.6.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name      = "effect_output.speaker-autogain"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
