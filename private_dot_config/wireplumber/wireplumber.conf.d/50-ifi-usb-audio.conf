monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-iFi_*"
      }
    ]
    actions = {
      update-props = {
        # Higher priority so the iFi becomes default sink when connected
        priority.session = 2000
        # Enable auto-profile so WirePlumber picks the highest-priority
        # profile (analog-stereo) instead of defaulting to pro-audio
        api.acp.auto-profile = true
        # Use software volume — the iFi's ALSA hardware mixer reports
        # changes but the DAC ignores them, so volume keys have no effect
        api.alsa.soft-mixer = true
      }
    }
  }
]
