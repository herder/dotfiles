# QBZ DAC Setup - iFi USB Audio SE Digital Stereo (IEC958)
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.usb-iFi_iFi_USB_Audio_SE_iFi_USB_Audio_SE-00.iec958-stereo", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        audio.allowed-rates = [ 44100 48000 88200 96000 176400 192000 352800 384000 ]
        resample.disable = true
        channelmix.disable = true
      }
    }
  }
]
