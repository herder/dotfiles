monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Lenovo_ThinkPad_Thunderbolt_3_Dock_USB_Audio_*"
      }
    ]
    actions = {
      update-props = {
        # No speakers connected to the dock. Disable the device so
        # PipeWire never opens its ALSA endpoints — this also frees
        # USB isochronous bandwidth on the shared full-speed TT for
        # the iFi DAC.
        device.profile = "off"
      }
    }
  }
]
