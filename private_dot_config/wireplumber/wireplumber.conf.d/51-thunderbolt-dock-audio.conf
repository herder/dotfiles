monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Lenovo_ThinkPad_Thunderbolt_3_Dock_USB_Audio_*"
      }
    ]
    actions = {
      update-props = {
        # Lower priority so the laptop speakers (1000) are preferred.
        # No speakers connected to the dock — this output is unused.
        priority.session = 500
      }
    }
  }
]
